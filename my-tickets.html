<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title data-i18n="tickets.meta.title">我的案件記錄｜ESI Taiwan</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { padding-top: var(--nav-h); }
    .page-wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px; }
    .ticket-list { display:flex; flex-direction:column; gap:14px; margin-top:8px; }
    .ticket-item { background:#fff; border-radius:14px; padding:20px 22px; border:1px solid var(--border); box-shadow:var(--shadow); }
    .ticket-no   { font-family:monospace; font-size:.85rem; color:var(--primary); font-weight:700; }
    .ticket-meta { font-size:.82rem; color:var(--muted); margin:4px 0 8px; }
    .ticket-desc { font-size:.9rem; color:var(--text); }
    .t-badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.78rem; font-weight:700; }
    .t-badge.open     { background:#e8f4ff; color:#0052cc; }
    .t-badge.progress { background:#fff3cd; color:#856404; }
    .t-badge.closed   { background:#e8f8e8; color:#1a7a1a; }
    .t-badge.low      { background:#e8f8e8; color:#1a7a1a; }
    .t-badge.normal   { background:#fff3cd; color:#856404; }
    .t-badge.urgent   { background:#fde8e8; color:#cc2200; }
    .user-bar { display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:14px; padding:14px 20px; margin-bottom:24px; border:1px solid var(--border); box-shadow:var(--shadow); }
    .logout-btn { padding:8px 18px; border-radius:99px; border:1.5px solid #e0e8f0; background:#fff; color:var(--muted); font-family:inherit; font-size:.85rem; cursor:pointer; }
    .back-btn { display:inline-flex; align-items:center; gap:6px; padding:9px 20px; border-radius:99px; border:1.5px solid var(--primary); color:var(--primary); background:#fff; font-family:inherit; font-size:.88rem; font-weight:600; cursor:pointer; text-decoration:none; margin-bottom:20px; }
    /* msg modal */
    .msg-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
    .msg-modal{background:#fff;border-radius:20px;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.3)}
    .msg-modal-header{padding:18px 24px;border-bottom:1px solid #e0e8f0;display:flex;justify-content:space-between;align-items:center}
    .msg-modal-header h3{margin:0;color:#0052cc;font-size:1rem}
    .msg-modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#8899aa;line-height:1}
    .msg-thread{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
    .msg-bubble{max-width:85%;padding:12px 16px;border-radius:14px;font-size:.88rem;line-height:1.6}
    .msg-bubble.admin{align-self:flex-start;background:#f0f4ff;color:#1a2a4a;border-radius:14px 14px 14px 4px}
    .msg-bubble.user{align-self:flex-end;background:linear-gradient(135deg,#0052cc,#00b4d8);color:#fff;border-radius:14px 14px 4px 14px}
    .msg-meta{font-size:.75rem;opacity:.7;margin-bottom:4px}
    .msg-input-area{padding:16px 24px;border-top:1px solid #e0e8f0;display:flex;gap:10px}
    .msg-input-area textarea{flex:1;padding:10px 14px;border:1.5px solid #c8d8f0;border-radius:10px;font-size:.9rem;font-family:inherit;resize:none;height:72px;outline:none}
    .msg-input-area textarea:focus{border-color:#0052cc}
    .msg-send-btn{padding:0 18px;background:linear-gradient(135deg,#0052cc,#00b4d8);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem}
  </style>
</head>
<body>
<div id="msgModal" class="msg-modal-overlay" style="display:none">
  <div class="msg-modal">
    <div class="msg-modal-header">
      <h3 id="msgModalTitle" data-i18n="repair.msg.title">對話記錄</h3>
      <button class="msg-modal-close" onclick="closeMsgModal()">✕</button>
    </div>
    <div class="msg-thread" id="msgThread"></div>
    <div class="msg-input-area" style="flex-direction:column;gap:8px">
      <textarea id="msgInput" placeholder="輸入回覆訊息…" data-i18n-placeholder="repair.msg.inputPh"></textarea>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button type="button" onclick="document.getElementById('msgFileInput').click()" style="padding:6px 12px;border:1.5px dashed #c8d8f0;border-radius:8px;background:#f8faff;color:#0052cc;font-size:.82rem;cursor:pointer;font-family:inherit" data-i18n="tickets.addAttachment">＋ 附件</button>
        <input type="file" id="msgFileInput" multiple style="display:none"/>
        <div id="msgFileList" style="flex:1;font-size:.8rem"></div>
        <button class="msg-send-btn" onclick="sendUserMsg()" data-i18n="repair.msg.send">發送回覆</button>
      </div>
    </div>
  </div>
</div>
<div class="page-wrap">
  <a href="repair.html" class="back-btn" data-i18n="tickets.back">← 返回報修頁面</a>
  <div class="user-bar">
    <div><span data-i18n="repair.loggedIn">已登入：</span><strong id="userNameDisplay"></strong>　<span style="color:var(--muted)" id="userCompanyDisplay"></span></div>
    <button class="logout-btn" onclick="logout()" data-i18n="repair.logout">登出</button>
  </div>
  <h2 style="margin-bottom:6px" data-i18n="tickets.title">📋 我的案件記錄</h2>
  <p style="color:var(--muted);margin-bottom:20px" data-i18n="tickets.subtitle">以下為您歷史報修案件</p>
  <div id="ticketList" class="ticket-list">
    <p style="color:var(--muted);text-align:center;padding:20px 0" data-i18n="repair.msg.loading">載入中…</p>
  </div>
</div>
<script>
  window.ESI_I18N = { en: {
    'tickets.meta.title': 'My Tickets | ESI Taiwan',
    'tickets.addAttachment': '＋ Attachment',
    'tickets.back': '← Back to Repair Page',
    'tickets.title': '📋 My Tickets',
    'tickets.subtitle': 'Your repair ticket history',
    'repair.msg.title': 'Conversation',
    'repair.msg.inputPh': 'Type a reply…',
    'repair.msg.send': 'Send Reply',
    'repair.msg.sending': 'Sending…',
    'repair.msg.loading': 'Loading…',
    'repair.msg.none': 'No conversation yet',
    'repair.msg.loadFailed': 'Failed to load',
    'repair.msg.emptyInput': 'Please enter a message or select an attachment',
    'repair.msg.sendFailed': 'Failed to send: ',
    'repair.msg.connFailed': 'Connection failed',
    'repair.msg.unknownErr': 'Unknown error',
    'repair.loggedIn': 'Logged in: ',
    'repair.logout': 'Log Out',
    'repair.noTickets': 'You have no repair tickets yet',
    'repair.loadFailed': 'Failed to load',
    'repair.status.open': 'Open',
    'repair.status.progress': 'In Progress',
    'repair.status.closed': 'Closed',
    'repair.priority.low': 'Low',
    'repair.priority.normal': 'Normal',
    'repair.priority.urgent': 'Urgent',
    'repair.dialogHistory': '💬 Conversation',
    'tickets.attachTooLarge': '❌ Total attachment size exceeds 100MB. Please remove some files and try again',
    'tickets.uploadFailed': '❌ Upload failed: ',
    'tickets.uploadFailedConn': '❌ Upload failed, please check your network connection'
  }};
</script>
<script src="i18n.js"></script>
<script>
(function(){
  const API = '/api/repair';
  let currentUser = null;
  function T(key, fallback){ return (window.t && window.t(key)) || fallback; }

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 檢查登入
  const saved = sessionStorage.getItem('esi_repair_user');
  if (!saved) { location.href='repair.html'; return; }
  currentUser = JSON.parse(saved);
  document.getElementById('userNameDisplay').textContent    = currentUser.name;
  document.getElementById('userCompanyDisplay').textContent = currentUser.company;

  function logout(){
    sessionStorage.removeItem('esi_repair_user');
    location.href = 'repair.html';
  }
  window.logout = logout;

  // 載入案件
  async function loadTickets(){
    const list = document.getElementById('ticketList');
    try {
      const r = await fetch(API+'/tickets/'+currentUser.id);
      const rows = await r.json();
      if(!rows.length){
        list.innerHTML='<p style="color:var(--muted);text-align:center;padding:20px 0">'+T('repair.noTickets','目前沒有報修記錄')+'</p>';
        return;
      }
      const statusMap  = {open:T('repair.status.open','處理中'), progress:T('repair.status.progress','進行中'), closed:T('repair.status.closed','已結案')};
      const priorityMap = {low:T('repair.priority.low','輕微'), normal:T('repair.priority.normal','中等'), urgent:T('repair.priority.urgent','緊急')};
      list.innerHTML = rows.map(t=>{
        const dt = new Date(t.created_at).toLocaleDateString('zh-TW')+' '+
                   new Date(t.created_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
        const sClass = t.status==='closed'?'closed':t.status==='progress'?'progress':'open';
        return '<div class="ticket-item">'
          +'<div class="ticket-no">'+esc(t.ticket_no)+'</div>'
          +'<div class="ticket-meta">'+dt+' · '
          +'<span class="t-badge '+t.priority+'">'+(priorityMap[t.priority]||t.priority)+'</span> '
          +'<span class="t-badge '+sClass+'">'+(statusMap[t.status]||t.status)+'</span>'
          +' · '+esc(t.product_type)+'</div>'
          +'<div class="ticket-desc">'+(t.description.includes('/assets/uploads/') ? t.description.replace(/\n/g,'<br>') : esc(t.description))+'</div>'
          +'<button class="msg-open-btn" data-id="'+t.id+'" data-no="'+esc(t.ticket_no)+'" '
          +'style="margin-top:10px;padding:6px 16px;background:#f0f4ff;color:#0052cc;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.82rem;cursor:pointer">'+T('repair.dialogHistory','💬 對話記錄')+'</button>'
          +'</div>';
      }).join('');
    } catch(e){
      list.innerHTML='<p style="color:var(--muted);text-align:center">'+T('repair.loadFailed','載入失敗')+'</p>';
    }
  }
  loadTickets();

  // event delegation
  document.getElementById('ticketList').addEventListener('click', function(e){
    const btn = e.target.closest('.msg-open-btn');
    if(btn) openMsgModal(parseInt(btn.dataset.id), btn.dataset.no);
  });

  // msg modal
  let _currentTicketId = null;
  window.openMsgModal = async function(ticketId, ticketNo){
    _currentTicketId = ticketId;
    document.getElementById('msgModalTitle').textContent = T('repair.msg.title','對話記錄')+'　'+ticketNo;
    document.getElementById('msgModal').style.display = 'flex';
    document.getElementById('msgInput').value = '';
    await refreshMsgThread();
  };
  window.closeMsgModal = function(){
    document.getElementById('msgModal').style.display = 'none';
    _currentTicketId = null;
  };
  async function refreshMsgThread(){
    const thread = document.getElementById('msgThread');
    thread.innerHTML = '<p style="color:#8899aa;text-align:center">'+T('repair.msg.loading','載入中…')+'</p>';
    try {
      const r = await fetch(API+'/tickets/'+_currentTicketId+'/messages?user_id='+currentUser.id);
      const msgs = await r.json();
      if(!msgs.length){ thread.innerHTML='<p style="color:#8899aa;text-align:center;padding:20px">'+T('repair.msg.none','尚無對話記錄')+'</p>'; return; }
      thread.innerHTML = msgs.map(m=>{
        const dt = new Date(m.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        return '<div class="msg-bubble '+m.sender_type+'"><div class="msg-meta">'+esc(m.sender_name)+' ・ '+dt+'</div><div style="white-space:pre-wrap">'+(m.message.includes('/assets/uploads/') ? m.message.replace(/\n/g,'<br>') : esc(m.message))+'</div></div>';
      }).join('');
      thread.scrollTop = thread.scrollHeight;
    } catch(e){ thread.innerHTML='<p style="color:#cc2200;text-align:center">'+T('repair.msg.loadFailed','載入失敗')+'</p>'; }
  }
  window.sendUserMsg = async function(){
    const msg = document.getElementById('msgInput').value.trim();
    const msgFiles = window._msgFiles || [];
    if(!msg && !msgFiles.length){ alert(T('repair.msg.emptyInput','請輸入訊息或選擇附件')); return; }
    const btn = document.querySelector('.msg-send-btn');
    btn.disabled=true; btn.textContent=T('repair.msg.sending','發送中…');
    let fileLinks = '';
    if (msgFiles.length > 0) {
      const totalSize = msgFiles.reduce(function(s,f){return s+f.size;}, 0);
      if (totalSize > 100*1024*1024) {
        alert(T('tickets.attachTooLarge','❌ 附件總大小超過 100MB，請減少檔案後再試'));
        btn.disabled=false; btn.textContent=T('repair.msg.send','發送回覆');
        return;
      }
      const fd2 = new FormData();
      msgFiles.forEach(function(f){ fd2.append('files', f); });
      try {
        const ur = await fetch('/api/upload/multi', {method:'POST', body:fd2});
        const ud = await ur.json();
        if (ur.ok) {
          fileLinks = '\n\n📎 附件：\n' + ud.files.map(function(f){return '<a href="'+f.url+'" target="_blank">'+f.name+'</a>';}).join('\n');
        } else {
          alert(T('tickets.uploadFailed','❌ 上傳失敗：')+(ud.error||T('repair.msg.unknownErr','未知錯誤')));
          btn.disabled=false; btn.textContent=T('repair.msg.send','發送回覆');
          return;
        }
      } catch(e){
        alert(T('tickets.uploadFailedConn','❌ 上傳失敗，請檢查網路連線'));
        btn.disabled=false; btn.textContent=T('repair.msg.send','發送回覆');
        return;
      }
    }
    try {
      const r = await fetch(API+'/tickets/'+_currentTicketId+'/messages',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({user_id:currentUser.id, message:msg+fileLinks})
      });
      const d = await r.json();
      if(!r.ok){ alert(T('repair.msg.sendFailed','發送失敗：')+(d.error||T('repair.msg.unknownErr','未知錯誤'))); return; }
      document.getElementById('msgInput').value='';
      window._msgFiles=[];
      if(document.getElementById('msgFileList')) document.getElementById('msgFileList').innerHTML='';
      await refreshMsgThread();
    } catch(e){ alert(T('repair.msg.connFailed','連線失敗')); }
    finally{ btn.disabled=false; btn.textContent=T('repair.msg.send','發送回覆'); }
  };
  document.getElementById('msgModal').addEventListener('click',function(e){ if(e.target===this) closeMsgModal(); });
})();
</script>
<script>
window._msgFiles = [];
document.addEventListener('DOMContentLoaded', function() {
  var input = document.getElementById('msgFileInput');
  if (input) {
    input.addEventListener('change', function() {
      Array.from(this.files).forEach(function(f) {
        if (!window._msgFiles.find(function(x){return x.name===f.name&&x.size===f.size;}))
          window._msgFiles.push(f);
      });
      this.value = '';
      renderMsgFileList();
    });
  }
});
function renderMsgFileList() {
  var el = document.getElementById('msgFileList');
  if (!el) return;
  if (!window._msgFiles.length) { el.innerHTML=''; return; }
  el.innerHTML = window._msgFiles.map(function(f,i){
    return '<span style="display:inline-flex;align-items:center;gap:4px;background:#e8f0fe;border-radius:6px;padding:2px 8px;margin:2px">📎 '+f.name+' <button type="button" onclick="removeMsgFile('+i+')" style="border:none;background:none;color:#cc2200;cursor:pointer;font-size:.9rem;padding:0">×</button></span>';
  }).join('');
}
function removeMsgFile(i) {
  window._msgFiles.splice(i,1);
  renderMsgFileList();
}
</script>
</body>
</html>
