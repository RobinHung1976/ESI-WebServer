<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title data-i18n="reset.meta.title">重置密碼｜ESI Taiwan</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body{padding-top:var(--nav-h);background:linear-gradient(135deg,#000c22,#002266);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .reset-box{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.5);text-align:center}
    .reset-box h2{margin:0 0 8px;color:#0052cc}
    .reset-box p{color:#5a6678;font-size:.9rem;margin:0 0 28px}
    .reset-box input{width:100%;box-sizing:border-box;padding:12px 16px;border:1.5px solid #c8d8f0;border-radius:10px;font-size:1rem;font-family:inherit;outline:none;transition:border-color .2s;margin-bottom:12px}
    .reset-box input:focus{border-color:#0052cc;box-shadow:0 0 0 3px rgba(0,82,204,.12)}
    .reset-box button{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#0052cc,#00b4d8);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px}
    .reset-box button:disabled{opacity:.6;cursor:not-allowed}
    .msg{padding:12px 16px;border-radius:10px;font-size:.88rem;margin-bottom:16px;display:none}
    .msg.success{background:#e8f8e8;color:#1a7a1a;display:block}
    .msg.error{background:#fde8e8;color:#cc2200;display:block}
    .back-link{display:block;margin-top:20px;color:#8899aa;font-size:.85rem;text-decoration:none}
    .back-link:hover{color:#0052cc}
  </style>
</head>
<body>
<div class="reset-box" id="boxVerifying">
  <h2 data-i18n="reset.verifying.title">🔐 密碼重置</h2>
  <p data-i18n="reset.verifying.desc">驗證連結中，請稍候…</p>
</div>

<div class="reset-box" id="boxReset" style="display:none">
  <h2 data-i18n="reset.form.title">🔐 設定新密碼</h2>
  <p id="resetGreeting" data-i18n="reset.form.greeting">請設定您的新密碼</p>
  <div class="msg" id="resetMsg"></div>
  <input type="password" id="newPass" placeholder="新密碼（至少 8 個字元）" minlength="8" data-i18n-placeholder="reset.form.newPassPh"/>
  <input type="password" id="confirmPass" placeholder="確認新密碼" data-i18n-placeholder="reset.form.confirmPassPh"/>
  <button onclick="doReset()" data-i18n="reset.form.submit">確認重置密碼</button>
  <a class="back-link" href="#" id="backLink" data-i18n="reset.form.backLink">← 返回登入頁</a>
</div>

<div class="reset-box" id="boxDone" style="display:none">
  <div style="font-size:3rem;margin-bottom:16px">✅</div>
  <h2 data-i18n="reset.done.title">密碼已重置</h2>
  <p data-i18n="reset.done.desc">您的密碼已成功更新，請使用新密碼登入。</p>
  <a id="doneLink" href="#" style="display:inline-block;margin-top:20px;padding:13px 32px;background:linear-gradient(135deg,#0052cc,#00b4d8);color:#fff;text-decoration:none;border-radius:10px;font-weight:700" data-i18n="reset.done.cta">前往登入</a>
</div>

<div class="reset-box" id="boxError" style="display:none">
  <div style="font-size:3rem;margin-bottom:16px">❌</div>
  <h2 data-i18n="reset.error.title">連結已失效</h2>
  <p data-i18n="reset.error.desc">此重置連結已過期或不存在，請重新申請。</p>
  <a id="errorLink" href="#" style="display:inline-block;margin-top:20px;padding:13px 32px;background:linear-gradient(135deg,#0052cc,#00b4d8);color:#fff;text-decoration:none;border-radius:10px;font-weight:700" data-i18n="reset.error.cta">重新申請</a>
</div>

<script>
  window.ESI_I18N = { en: {
    'reset.meta.title': 'Reset Password | ESI Taiwan',
    'reset.verifying.title': '🔐 Password Reset',
    'reset.verifying.desc': 'Verifying your link, please wait…',
    'reset.form.title': '🔐 Set a New Password',
    'reset.form.greeting': 'Please set your new password',
    'reset.form.newPassPh': 'New password (at least 8 characters)',
    'reset.form.confirmPassPh': 'Confirm new password',
    'reset.form.submit': 'Confirm Password Reset',
    'reset.form.submitting': 'Processing…',
    'reset.form.backLink': '← Back to Login',
    'reset.greetingHello': 'Hello ',
    'reset.greetingSuffix': ', please set a new password',
    'reset.errMinLength': 'Password must be at least 8 characters',
    'reset.errMismatch': 'Passwords do not match',
    'reset.errDefault': 'Reset failed',
    'reset.errNetwork': 'Connection failed',
    'reset.done.title': 'Password Reset Complete',
    'reset.done.desc': 'Your password has been updated. Please log in with your new password.',
    'reset.done.cta': 'Go to Login',
    'reset.error.title': 'Link Expired',
    'reset.error.desc': 'This reset link has expired or does not exist. Please request a new one.',
    'reset.error.cta': 'Request Again'
  }};
</script>
<script src="i18n.js"></script>
<script>
(function(){
  function T(key, fallback){ return (window.t && window.t(key)) || fallback; }
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const type  = params.get('type');
  const backUrl  = type === 'admin' ? 'admin-repair.html' : 'repair.html';
  const doneUrl  = type === 'admin' ? 'admin-repair.html' : 'repair.html';
  const errorUrl = type === 'admin' ? 'admin-repair.html' : 'repair.html';

  document.getElementById('backLink').href  = backUrl;
  document.getElementById('doneLink').href  = doneUrl;
  document.getElementById('errorLink').href = errorUrl;

  if (!token || !type) {
    show('boxError'); return;
  }

  // 驗證 token
  fetch('/api/reset-password/verify?token='+encodeURIComponent(token)+'&type='+type)
    .then(r=>r.json())
    .then(d=>{
      if (!d.ok) { show('boxError'); return; }
      document.getElementById('resetGreeting').textContent = T('reset.greetingHello','您好 ')+d.name+T('reset.greetingSuffix','，請設定新密碼');
      show('boxReset');
    })
    .catch(()=>show('boxError'));

  function show(id){
    ['boxVerifying','boxReset','boxDone','boxError'].forEach(i=>{
      document.getElementById(i).style.display = i===id ? 'block' : 'none';
    });
  }

  window.doReset = async function(){
    const pass    = document.getElementById('newPass').value.trim();
    const confirm = document.getElementById('confirmPass').value.trim();
    const msg     = document.getElementById('resetMsg');
    msg.className = 'msg';

    if (pass.length < 8){ msg.className='msg error'; msg.textContent=T('reset.errMinLength','密碼至少 8 個字元'); return; }
    if (pass !== confirm){ msg.className='msg error'; msg.textContent=T('reset.errMismatch','兩次密碼不一致'); return; }

    const btn = document.querySelector('#boxReset button');
    btn.disabled = true; btn.textContent = T('reset.form.submitting','處理中…');

    try {
      const r = await fetch('/api/reset-password', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({token, type, password: pass})
      });
      const d = await r.json();
      if (!r.ok){ msg.className='msg error'; msg.textContent=d.error||T('reset.errDefault','重置失敗'); btn.disabled=false; btn.textContent=T('reset.form.submit','確認重置密碼'); return; }
      show('boxDone');
    } catch(e){
      msg.className='msg error'; msg.textContent=T('reset.errNetwork','連線失敗');
      btn.disabled=false; btn.textContent=T('reset.form.submit','確認重置密碼');
    }
  };
})();
</script>
</body>
</html>
