<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>文章審核｜ESI Taiwan 後台</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body{padding-top:var(--nav-h);background:#f0f4fa}
    .admin-wrap{max-width:1100px;margin:0 auto;padding:32px 20px}
    .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .admin-header h1{font-size:1.4rem;font-weight:800}
    .badge{display:flex;align-items:center;gap:10px;background:#fff;border-radius:99px;padding:6px 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:.88rem}
    .stat-bar{display:flex;gap:12px;margin-bottom:20px}
    .stat{background:#fff;border-radius:12px;padding:14px 20px;flex:1;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .stat strong{display:block;font-size:1.6rem;font-weight:800;color:var(--primary)}
    .stat span{font-size:.8rem;color:var(--muted)}
    .draft-card{background:#fff;border-radius:14px;padding:20px 24px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid var(--primary)}
    .draft-meta{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
    .cat-tag{padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700;background:#e8f0fe;color:#1a56db}
    .draft-title{font-size:1rem;font-weight:700;margin-bottom:8px;line-height:1.5}
    .draft-body{font-size:.85rem;color:var(--muted);line-height:1.7;max-height:80px;overflow:hidden;position:relative}
    .draft-body::after{content:'';position:absolute;bottom:0;left:0;right:0;height:24px;background:linear-gradient(transparent,#fff)}
    .draft-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .btn-publish{padding:8px 18px;border:none;border-radius:8px;background:linear-gradient(135deg,#0052cc,#00b4d8);color:#fff;font-size:.85rem;font-weight:700;cursor:pointer}
    .btn-edit{padding:8px 18px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-size:.85rem;font-weight:700;cursor:pointer}
    .btn-delete{padding:8px 18px;border:none;border-radius:8px;background:#fde8e8;color:#cc2200;font-size:.85rem;font-weight:700;cursor:pointer}
    .source-link{font-size:.78rem;color:var(--primary);text-decoration:none}
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    /* Login overlay */
    #loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#000c22,#002266);display:flex;align-items:center;justify-content:center;z-index:9999}
    .login-box{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
    .login-box h2{margin:0 0 24px;font-size:1.4rem;text-align:center}
    .login-box input{width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #c8d8f0;border-radius:10px;font-size:.95rem;font-family:inherit;outline:none;margin-bottom:10px}
    .login-box input:focus{border-color:#0052cc}
    #loginBtn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#0052cc,#00b4d8);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px}
    #loginError{color:#cc2200;font-size:.85rem;margin-top:8px;min-height:1.2em;text-align:center}
    /* Edit modal */
    #editModal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
    #editModal.open{display:flex}
    .edit-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto}
    .edit-box h3{margin:0 0 16px}
    .edit-box label{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px;margin-top:12px}
    .edit-box input,.edit-box textarea,.edit-box select{width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.9rem;font-family:inherit;outline:none}
    .edit-box textarea{min-height:160px;resize:vertical}
    .edit-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  </style>
</head>
<body>
<!-- Login -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔐 後台登入</h2>
    <input type="email" id="emailInput" placeholder="管理員 Email"/>
    <input type="password" id="keyInput" placeholder="密碼"/>
    <button id="loginBtn">登入</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- Nav -->
<nav class="navbar">
  <div class="nav-inner">
    
    <div style="display:flex;gap:12px;align-items:center">
      <a href="admin-repair.html" id="navRepair" style="font-size:.85rem;color:var(--muted)">報修管理</a>
      <a href="admin-contact.html" id="navContact" style="font-size:.85rem;color:var(--muted)">洽詢管理</a>
      <span style="font-size:.85rem;font-weight:700;color:var(--primary)">文章審核</span>
      <a href="admin-users.html" id="navAdminUsers" style="display:none;font-size:.85rem;color:var(--muted)">👑 管理員管理</a>
      <div id="adminBadge" class="badge" style="display:none">
        <span>👤</span><span id="adminBadgeName"></span>
        <button onclick="adminLogout()" style="border:none;background:none;color:#cc2200;cursor:pointer;font-size:.8rem">登出</button>
      </div>
    </div>
  </div>
</nav>

<!-- 權限不足畫面 -->
<div id="deniedScreen" class="admin-wrap" style="display:none;text-align:center;padding:80px 20px">
  <div style="font-size:3.5rem;margin-bottom:16px">🚫</div>
  <h2 style="color:#c03010;margin-bottom:8px">權限不足</h2>
  <p style="color:var(--muted)">您的帳號沒有「文章審核」模組的存取權限，請聯絡超級管理員協助開通。</p>
</div>

<div class="admin-wrap" id="mainContent" style="display:none">
  <div class="admin-header">
    <h1>📰 文章審核</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="fetchCat" style="padding:9px 14px;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.88rem;font-family:inherit;outline:none">
        <option value="">隨機分類</option>
        <option value="uc">整合通訊</option>
        <option value="cc">Call Center｜IVR</option>
        <option value="gateway">Gateway｜SBC</option>
        <option value="ipphone">IP Phone｜Teams Phone</option>
        <option value="meeting">會議設備</option>
      </select>
      <button class="btn btn-primary" onclick="triggerFetch()" id="fetchBtn">📡 抓取新文章</button>
      <button class="btn btn-outline" onclick="fetchDrafts()">🔄 重新整理</button>
    </div>
  </div>
  <div id="fetchStatus" style="margin-bottom:16px;padding:12px 16px;border-radius:10px;display:none;font-size:.88rem"></div>

  <div class="stat-bar">
    <div class="stat"><strong id="statDraft">-</strong><span>待審核</span></div>
    <div class="stat"><strong id="statToday">-</strong><span>今日新增</span></div>
    <div class="stat"><strong id="statTotal">-</strong><span>已發布總數</span></div>
  </div>

  <div id="draftsContainer">
    <div class="empty">載入中...</div>
  </div>

  <!-- 最新消息管理 -->
  <div style="margin-top:40px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:1.2rem;font-weight:800">📰 最新消息管理</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="month" id="newsDateFrom" style="padding:8px 12px;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.85rem;font-family:inherit;outline:none"/>
        <span style="color:var(--muted);font-size:.85rem">～</span>
        <input type="month" id="newsDateTo" style="padding:8px 12px;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.85rem;font-family:inherit;outline:none"/>
        <button class="btn btn-primary" onclick="fetchNewsArticles()" style="padding:8px 16px">🔍 篩選</button>
        <button class="btn btn-outline" onclick="clearNewsFilter()">清除</button>
      </div>
    </div>
    <div id="newsContainer"><div class="empty">載入中...</div></div>
  </div>

  <!-- 交流天地文章管理 -->
  <div style="margin-top:40px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:1.2rem;font-weight:800">💬 交流天地文章管理</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="month" id="postDateFrom" style="padding:8px 12px;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.85rem;font-family:inherit;outline:none"/>
        <span style="color:var(--muted);font-size:.85rem">～</span>
        <input type="month" id="postDateTo" style="padding:8px 12px;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.85rem;font-family:inherit;outline:none"/>
        <button class="btn btn-primary" onclick="fetchPosts()" style="padding:8px 16px">🔍 篩選</button>
        <button class="btn btn-outline" onclick="clearPostFilter()">清除</button>
        <select id="postCatFilter" onchange="fetchPosts()" style="padding:8px 12px;border:1.5px solid #c8d8f0;border-radius:8px;font-size:.85rem;font-family:inherit;outline:none">
          <option value="">全部分類</option>
          <option value="uc">整合通訊</option>
          <option value="cc">Call Center｜IVR</option>
          <option value="gateway">Gateway｜SBC</option>
          <option value="ipphone">IP Phone｜Teams Phone</option>
          <option value="meeting">會議設備</option>
          <option value="tips">使用技巧</option>
          <option value="share">資料分享</option>
        </select>
        <button class="btn btn-outline" onclick="fetchPosts()">🔄 重新整理</button>
      </div>
    </div>
    <div id="postsContainer"><div class="empty">載入中...</div></div>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal">
  <div class="edit-box">
    <h3>✏️ 編輯草稿</h3>
    <input type="hidden" id="editId"/>
    <label>分類</label>
    <select id="editCat">
      <option value="uc">整合通訊</option>
      <option value="cc">Call Center｜IVR</option>
      <option value="gateway">Gateway｜SBC</option>
      <option value="ipphone">IP Phone｜Teams Phone</option>
      <option value="meeting">會議設備</option>
      <option value="tips">使用技巧</option>
    </select>
    <label>標題</label>
    <input type="text" id="editTitle"/>
    <label>內容</label>
    <textarea id="editBody"></textarea>
    <div class="edit-actions">
      <button class="btn-edit" onclick="closeEdit()">取消</button>
      <button class="btn-publish" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<script src="site.js"></script>
<script>
  const API = '/api';
  let adminKey = '';

  // 依角色與權限顯示/隱藏功能
  function applyRoleUI(admin){
    const isSuper = admin.role === 'super';
    const perms = admin.permissions || [];
    const hasContact = isSuper || perms.includes('contact');
    const hasRepair  = isSuper || perms.includes('repair');
    const hasNews    = isSuper || perms.includes('news');

    const navAdminUsers = document.getElementById('navAdminUsers');
    if (navAdminUsers) navAdminUsers.style.display = isSuper ? '' : 'none';
    const navContact = document.getElementById('navContact');
    if (navContact) navContact.style.display = hasContact ? '' : 'none';
    const navRepair = document.getElementById('navRepair');
    if (navRepair) navRepair.style.display = hasRepair ? '' : 'none';

    // 本頁（文章審核）需要 news 權限，沒有則顯示拒絕畫面
    if (!hasNews) {
      document.getElementById('deniedScreen').style.display = 'block';
      document.getElementById('mainContent').style.display = 'none';
      return false;
    }
    document.getElementById('deniedScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    return true;
  }

  // Restore session
  const saved = sessionStorage.getItem('esi_admin');
  if (saved) {
    const a = JSON.parse(saved);
    adminKey = a.session_token || '';
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('adminBadge').style.display = 'flex';
    document.getElementById('adminBadgeName').textContent = a.name || a.email;
    if (applyRoleUI(a)) {
      fetchDrafts();
      fetchStats();
      fetchNewsArticles();
      fetchPosts();
    }
  }

  // Login
  async function tryLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const pass  = document.getElementById('keyInput').value.trim();
    const err   = document.getElementById('loginError');
    const btn   = document.getElementById('loginBtn');
    if (!email || !pass) { err.textContent = '請輸入帳號與密碼'; return; }
    btn.disabled = true; btn.textContent = '驗證中…';
    try {
      const r = await fetch(API + '/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error || '登入失敗'; btn.disabled=false; btn.textContent='登入'; return; }
      adminKey = d.session_token;
      sessionStorage.setItem('esi_admin', JSON.stringify({...d.admin, session_token: d.session_token}));
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('adminBadge').style.display = 'flex';
      document.getElementById('adminBadgeName').textContent = d.admin.name || d.admin.email;
      if (applyRoleUI(d.admin)) {
        fetchDrafts();
        fetchStats();
        fetchNewsArticles();
        fetchPosts();
      }
    } catch(e) {
      err.textContent = '連線失敗';
      btn.disabled=false; btn.textContent='登入';
    }
  }
  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  document.getElementById('keyInput').addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });

  window.adminLogout = async function() {
    if (!confirm('確定要登出？')) return;
    try { await fetch(API+'/admin/logout', {method:'POST', headers:{'x-session-token':adminKey}}); } catch(e){}
    sessionStorage.removeItem('esi_admin');
    location.reload();
  };

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  const CAT_NAMES = {
    uc:'整合通訊', cc:'Call Center｜IVR', gateway:'Gateway｜SBC',
    ipphone:'IP Phone｜Teams Phone', meeting:'會議設備', tips:'使用技巧', share:'資料分享'
  };

  async function fetchDrafts() {
    const r = await fetch(API+'/admin/drafts', { headers:{'x-session-token':adminKey} });
    let drafts = await r.json();
    if (!r.ok || !Array.isArray(drafts)) {
      const status = document.getElementById('fetchStatus');
      if (status) {
        status.style.display = 'block';
        status.style.background = '#fde8e8';
        status.style.color = '#cc2200';
        status.textContent = '❌ ' + (drafts.error || '載入草稿失敗');
      }
      drafts = [];
    }
    const c = document.getElementById('draftsContainer');
    document.getElementById('statDraft').textContent = drafts.length;
    if (!drafts.length) {
      c.innerHTML = '<div class="empty">✅ 目前沒有待審核文章</div>';
      return;
    }
    c.innerHTML = drafts.map(d => `
      <div class="draft-card" id="card-${d.id}">
        <div class="draft-meta">
          <span class="cat-tag">${CAT_NAMES[d.category]||d.category}</span>
          <span style="font-size:.78rem;color:var(--muted)">${new Date(d.created_at).toLocaleString('zh-TW')}</span>
          ${d.source_url ? `<a class="source-link" href="${d.source_url}" target="_blank">🔗 原文來源</a>` : ''}
        </div>
        <div class="draft-title">${d.title}</div>
        <div class="draft-body">${d.body.replace(/\n/g,'<br>')}</div>
        <div class="draft-actions">
          <button class="btn-publish" onclick="publishDraft(${d.id})">✅ 發布</button>
          <button class="btn-edit" onclick="openEdit(${d.id},'${encodeURIComponent(d.category)}','${encodeURIComponent(d.title)}','${encodeURIComponent(d.body)}')">✏️ 編輯</button>
          <button class="btn-delete" onclick="deleteDraft(${d.id})">🗑️ 刪除</button>
        </div>
      </div>
    `).join('');
  }

  async function fetchStats() {
    // 已發布總數：從 news 表取得
    const r1 = await fetch(API+'/news');
    const news = await r1.json();
    document.getElementById('statTotal').textContent = Array.isArray(news) ? news.length : '-';
    // 今日新增：從 news 表計算今天發布的數量
    const today = new Date().toDateString();
    const todayCount = Array.isArray(news) ? news.filter(a => new Date(a.created_at).toDateString()===today).length : 0;
    document.getElementById('statToday').textContent = todayCount;
  }

  window.publishDraft = async function(id) {
    if (!confirm('確定要發布此文章到「最新消息」？')) return;
    const card = document.getElementById('card-'+id);

    // 由後端統一處理：寫入 news 表並刪除草稿（不會進入交流天地）
    const r = await fetch(API+'/admin/drafts/'+id+'/publish', {
      method:'PATCH', headers:{'x-session-token':adminKey}
    });

    if (r.ok) {
      card.remove();
      const stat = document.getElementById('statDraft');
      stat.textContent = parseInt(stat.textContent) - 1;
      alert('✅ 文章已發布到最新消息！');
      fetchNewsArticles();
    } else {
      const d = await r.json().catch(()=>({}));
      alert('❌ 發布失敗：' + (d.error || '未知錯誤'));
    }
  };

  window.deleteDraft = async function(id) {
    if (!confirm('確定要刪除此草稿？')) return;
    const r = await fetch(API+'/admin/drafts/'+id, {
      method:'DELETE', headers:{'x-session-token':adminKey}
    });
    if (r.ok) {
      document.getElementById('card-'+id).remove();
      const stat = document.getElementById('statDraft');
      stat.textContent = parseInt(stat.textContent) - 1;
    }
  };

  window.openEdit = function(id, cat, title, body) {
    document.getElementById('editId').value = id;
    document.getElementById('editCat').value = decodeURIComponent(cat);
    document.getElementById('editTitle').value = decodeURIComponent(title);
    document.getElementById('editBody').value = decodeURIComponent(body);
    document.getElementById('editModal').classList.add('open');
  };

  window.closeEdit = function() {
    document.getElementById('editModal').classList.remove('open');
  };

  window.saveEdit = async function() {
    const id    = document.getElementById('editId').value;
    const title = document.getElementById('editTitle').value.trim();
    const body  = document.getElementById('editBody').value.trim();
    const category = document.getElementById('editCat').value;
    if (!title || !body) { alert('請填寫標題與內容'); return; }
    const r = await fetch(API+'/admin/drafts/'+id, {
      method:'PATCH',
      headers:{'Content-Type':'application/json','x-session-token':adminKey},
      body: JSON.stringify({title, body, category})
    });
    if (r.ok) {
      closeEdit();
      fetchDrafts();
    }
  };

  window.triggerFetch = async function() {
    const cat = document.getElementById('fetchCat').value;
    const btn = document.getElementById('fetchBtn');
    const status = document.getElementById('fetchStatus');
    btn.disabled = true; btn.textContent = '抓取中…';
    status.style.display = 'block';
    status.style.background = '#e8f0fe';
    status.style.color = '#1a56db';
    status.textContent = '正在從 RSS 來源抓取文章，請稍候…';
    try {
      const r = await fetch(API+'/admin/fetch-rss', {
        method: 'POST',
        headers: {'Content-Type':'application/json','x-session-token': adminKey},
        body: JSON.stringify({ category: cat })
      });
      const d = await r.json();
      if (r.ok) {
        status.style.background = '#e8f8e8';
        status.style.color = '#1a7a1a';
        status.textContent = '✅ ' + (d.log || '抓取完成！');
        fetchDrafts();
      } else {
        status.style.background = '#fde8e8';
        status.style.color = '#cc2200';
        status.textContent = '❌ ' + (d.error || '抓取失敗');
      }
    } catch(e) {
      status.style.background = '#fde8e8';
      status.style.color = '#cc2200';
      status.textContent = '❌ 連線失敗';
    }
    btn.disabled = false; btn.textContent = '📡 抓取新文章';
  };

  // 最新消息管理
  async function fetchNewsArticles() {
    try {
      const r = await fetch(API+'/news', { headers:{'x-session-token':adminKey} });
      let articles = await r.json();
      if (!Array.isArray(articles)) articles = [];
      const from = document.getElementById('newsDateFrom').value;
      const to   = document.getElementById('newsDateTo').value;
      if (from) articles = articles.filter(a => (a.date||'') >= from);
      if (to)   articles = articles.filter(a => (a.date||'') <= to+'-31');
      const showAll = from || to;
      const display = showAll ? articles : articles.slice(0,3);
      const c = document.getElementById('newsContainer');
      if (!display.length) { c.innerHTML = '<div class="empty">尚無消息</div>'; return; }
      let rows = display.map(a => {
        return '<tr style="border-top:1px solid #e8f0fe;font-size:.85rem" id="news-row-'+a.id+'">'
          + '<td style="padding:12px 16px;color:var(--muted)">'+(a.date||'')+'</td>'
          + '<td style="padding:12px 16px"><span class="cat-tag">'+esc(a.brand||'')+'</span></td>'
          + '<td style="padding:12px 16px;font-weight:600">'+esc(a.title.substring(0,50))+(a.title.length>50?'…':'')+'</td>'
          + '<td style="padding:12px 16px;text-align:center"><button class="btn-delete" onclick="deleteNews('+a.id+')" style="padding:5px 12px;font-size:.8rem">刪除</button></td>'
          + '</tr>';
      }).join('');
      c.innerHTML = '<table style="width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)">'
        + '<thead><tr style="background:#f0f4fa;font-size:.82rem;color:var(--muted)">'
        + '<th style="padding:12px 16px;text-align:left">日期</th>'
        + '<th style="padding:12px 16px;text-align:left">分類</th>'
        + '<th style="padding:12px 16px;text-align:left">標題</th>'
        + '<th style="padding:12px 16px;text-align:center">操作</th>'
        + '</tr></thead><tbody>'+rows+'</tbody></table>'
        + (!showAll && articles.length>3 ? '<p style="text-align:center;margin-top:12px;font-size:.85rem;color:var(--muted)">共 '+articles.length+' 筆，請用日期篩選查看更多</p>' : '');
    } catch(e) { document.getElementById('newsContainer').innerHTML = '<div class="empty">載入失敗：'+e.message+'</div>'; }
  }

  window.clearNewsFilter = function() {
    document.getElementById('newsDateFrom').value = '';
    document.getElementById('newsDateTo').value = '';
    fetchNewsArticles();
  };

  window.deleteNews = async function(id) {
    if (!confirm('確定要刪除這篇消息？')) return;
    const r = await fetch(API+'/news/'+id, {
      method:'DELETE', headers:{'x-session-token':adminKey}
    });
    if (r.ok) {
      document.getElementById('news-row-'+id).remove();
    } else {
      alert('❌ 刪除失敗');
    }
  };

  // 交流天地文章管理
  async function fetchPosts() {
    try {
      const cat = document.getElementById('postCatFilter').value;
      const q = cat ? '?category='+cat : '';
      const r = await fetch(API+'/posts'+q, { headers:{'x-session-token':adminKey} });
      let posts = await r.json();
      if (!Array.isArray(posts)) posts = [];
      const from = document.getElementById('postDateFrom').value;
      const to   = document.getElementById('postDateTo').value;
      if (from) posts = posts.filter(p => p.created_at >= from);
      if (to)   posts = posts.filter(p => p.created_at <= to+'-31');
      const showAll = from || to || cat;
      const display = showAll ? posts : posts.slice(0,3);
      const c = document.getElementById('postsContainer');
      if (!display.length) { c.innerHTML = '<div class="empty">尚無文章</div>'; return; }
      let rows = display.map(p => {
        return '<tr style="border-top:1px solid #e8f0fe;font-size:.85rem" id="post-row-'+p.id+'">'
          + '<td style="padding:12px 16px;color:var(--muted)">'+new Date(p.created_at).toLocaleDateString('zh-TW')+'</td>'
          + '<td style="padding:12px 16px"><span class="cat-tag">'+(CAT_NAMES[p.category]||p.category)+'</span></td>'
          + '<td style="padding:12px 16px;font-weight:600">'+esc(p.title.substring(0,40))+(p.title.length>40?'…':'')+'</td>'
          + '<td style="padding:12px 16px;color:var(--muted)">'+esc(p.author)+'</td>'
          + '<td style="padding:12px 16px;text-align:center"><button class="btn-delete" onclick="deletePost('+p.id+')" style="padding:5px 12px;font-size:.8rem">刪除</button></td>'
          + '</tr>';
      }).join('');
      c.innerHTML = '<table style="width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)">'
        + '<thead><tr style="background:#f0f4fa;font-size:.82rem;color:var(--muted)">'
        + '<th style="padding:12px 16px;text-align:left">日期</th>'
        + '<th style="padding:12px 16px;text-align:left">分類</th>'
        + '<th style="padding:12px 16px;text-align:left">標題</th>'
        + '<th style="padding:12px 16px;text-align:left">作者</th>'
        + '<th style="padding:12px 16px;text-align:center">操作</th>'
        + '</tr></thead><tbody>'+rows+'</tbody></table>'
        + (!showAll && posts.length>3 ? '<p style="text-align:center;margin-top:12px;font-size:.85rem;color:var(--muted)">共 '+posts.length+' 筆，請用日期篩選或分類查看更多</p>' : '');
    } catch(e) { document.getElementById('postsContainer').innerHTML = '<div class="empty">載入失敗：'+e.message+'</div>'; }
  }

  window.clearPostFilter = function() {
    document.getElementById('postDateFrom').value = '';
    document.getElementById('postDateTo').value = '';
    document.getElementById('postCatFilter').value = '';
    fetchPosts();
  };

  window.deletePost = async function(id) {
    if (!confirm('確定要刪除這篇文章？')) return;
    const r = await fetch(API+'/admin/posts/'+id, {
      method:'DELETE', headers:{'x-session-token':adminKey}
    });
    if (r.ok) {
      document.getElementById('post-row-'+id).remove();
    } else {
      alert('❌ 刪除失敗');
    }
  };

  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEdit();
  });
</script>
</body>
</html>
